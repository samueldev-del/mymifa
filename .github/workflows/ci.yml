name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Moindre privilège : ces jobs ne font que lire le dépôt.
permissions:
  contents: read

concurrency:
  # Un groupe par référence Git : les runs d'une même PR se remplacent.
  group: ci-${{ github.ref }}
  # On annule les runs obsolètes sur une PR (seul le dernier commit compte),
  # mais jamais sur main, où chaque commit mérite d'être vérifié.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    # Garde-fou : sans timeout, un job bloqué tourne jusqu'à la limite
    # plateforme de 6 heures.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          # Obligatoire en monorepo : sans ce chemin, l'action cherche un
          # lockfile à la racine et n'en trouve pas.
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend — syntaxe & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
          
      # La syntaxe est vérifiée avant l'installation : si un fichier est cassé,
      # le job échoue en quelques secondes plutôt qu'après `npm ci`.
      # `node --check` reste utile malgré les tests : ceux-ci ne couvrent que
      # services/detection.js, les autres fichiers n'ont aucune autre vérification.
      - name: Vérifier la syntaxe de tous les fichiers JS
        working-directory: backend
        run: |
          set -euo pipefail
          find . -path ./node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  docker:
    name: Docker — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # hadolint valide le Dockerfile sans le construire : quelques secondes,
      # et il attrape les mauvaises pratiques avant le build coûteux.
      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      # Construit l'image sans la publier : on vérifie seulement qu'elle
      # se construit sur un environnement neuf, hors de la machine locale.
      - name: Build de l'image backend
        run: docker build -t mymifa-api:ci ./backend

  workflows:
    name: Workflows — lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # actionlint valide la syntaxe des workflows, les expressions ${{ }},
      # et le shell des blocs `run:` via shellcheck. Un YAML invalide ne
      # produit aucun run du tout : ni check rouge, ni message d'erreur.
      - name: Lint des workflows
        uses: raven-actions/actionlint@v2

  migrations:
    name: Migrations — reconstruction depuis zéro
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Même version majeure que la production (18.4) et que compose.yaml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mymifa
          POSTGRES_PASSWORD: mymifa_ci
          POSTGRES_DB: mymifa
        ports:
          - 5432:5432
        # Le job attend que la base accepte réellement les connexions.
        options: >-
          --health-cmd "pg_isready -U mymifa -d mymifa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Le service publie son port sur le runner : les étapes s'exécutent
      # directement sur la machine, pas dans un conteneur. D'où localhost,
      # là où compose.yaml utilise le nom de service `db`.
      # Pas de sslmode : le PostgreSQL du service n'a pas de certificat.
      - name: Appliquer les migrations sur une base vierge
        working-directory: backend
        env:
          DATABASE_URL: postgresql://mymifa:mymifa_ci@localhost:5432/mymifa
        run: npm run migrate

      # Un « Migrations terminées » ne prouve rien : lors de la mise au point,
      # ce message s'est affiché sur une base à laquelle il manquait 4 tables.
      # On vérifie donc l'état réel du schéma.
      - name: Vérifier que les 10 tables existent
        env:
          PGPASSWORD: mymifa_ci
        run: |
          set -euo pipefail
          nb=$(psql -h localhost -U mymifa -d mymifa -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
          echo "Tables trouvées : $nb"
          test "$nb" -eq 10

  publish:
    name: Docker — publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Uniquement sur main : une image par PR polluerait le registre sans usage,
    # aucun environnement ne consomme encore ces images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Ne publie que si l'image se construit et que les tests passent.
    needs: [backend, docker]

    # Surcharge le `permissions: contents: read` du fichier : ce job seul
    # a besoin d'écrire dans le registre.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fourni automatiquement par GitHub, portée limitée au run.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # `latest` pour la commodité, le SHA pour la traçabilité : c'est
          # lui qu'on déploiera, `latest` ne dit pas ce qui tourne réellement.
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}  
  terraform:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Alignée sur la contrainte `required_version` de versions.tf.
          terraform_version: 1.15.8
          # Sans ce réglage, l'action enveloppe les commandes dans un script
          # qui masque les codes de sortie : un `fmt -check` en échec
          # laisserait le job au vert.
          terraform_wrapper: false

      # Formatage canonique, comme gofmt : évite les diffs pollués par
      # de l'alignement et les débats d'indentation.
      - name: Vérifier le formatage
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      # `-backend=false` installe le provider sans contacter S3 : ce job
      # ne lit pas le state et n'a besoin d'aucun credential AWS.
      - name: Initialiser sans backend
        working-directory: infra
        run: terraform init -backend=false

      # Vérifie la cohérence de la configuration : syntaxe, attributs
      # inconnus, types, références vers des ressources inexistantes.
      - name: Valider la configuration
        working-directory: infra
        run: terraform validate           
