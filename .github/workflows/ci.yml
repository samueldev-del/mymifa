name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Moindre privilège : ces jobs ne font que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend — vérification syntaxique
    runs-on: ubuntu-latest
    # Plus court que le frontend : aucune dépendance n'est installée,
    # ce job ne fait que lire des fichiers.
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          # Pas de cache : on n'installe rien. `node --check` analyse
          # la syntaxe sans résoudre le moindre import.

      - name: Vérifier la syntaxe de tous les fichiers JS
        working-directory: backend
        run: |
          set -euo pipefail
          find . -path ./node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check