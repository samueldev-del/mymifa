name: Synchronisation des emails

# Déclenche la lecture IMAP côté API pour mettre à jour les statuts de
# candidature. GitHub Actions plutôt qu'un cron Vercel : le plan Hobby de
# Vercel limite les crons à une exécution par jour, trop lent pour repérer
# une réponse de recruteur.
on:
  # Le déclenchement planifié est passé à EventBridge Scheduler
  # (infra/scheduler.tf). L'événement `schedule` de GitHub est traité en
  # « meilleur effort » : mesuré à 19 exécutions par jour au lieu des 96
  # configurées, avec des écarts allant jusqu'à 2h43. EventBridge tient
  # les 15 minutes à la seconde près.
  #
  # Ce workflow reste déclenchable à la main depuis l'onglet Actions,
  # en secours si la chaîne AWS tombe.
  workflow_dispatch:

concurrency:
  # Deux synchronisations simultanées liraient la même boîte pour rien.
  group: sync-emails
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Appeler l'API de synchronisation
        env:
          API_URL: ${{ secrets.API_URL }}
          EMAIL_WEBHOOK_SECRET: ${{ secrets.EMAIL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          reponse=$(mktemp)
          code=$(curl -sS --max-time 120 \
            -o "$reponse" -w '%{http_code}' \
            -X POST "$API_URL/api/emails/sync" \
            -H "x-webhook-secret: $EMAIL_WEBHOOK_SECRET" \
            -H 'Content-Type: application/json')

          echo "HTTP $code"
          # jq est préinstallé sur ubuntu-latest ; en cas de réponse non-JSON
          # (page d'erreur de la plateforme), on affiche le corps brut.
          jq . "$reponse" 2>/dev/null || cat "$reponse"

          if [ "$code" != "200" ]; then
            echo "::error::La synchronisation a échoué (HTTP $code)"
            exit 1
          fi
